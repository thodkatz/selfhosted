services:

  loki:
    image: grafana/loki:${GRAFANA_LOKI_VERSION:-3.5.2}
    container_name: grafana-loki
    ports:
      - 127.0.0.1:3100:3100/tcp
    volumes:
      - /srv/selfhosted/grafana/config/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml


  prometheus:
     image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
     container_name: grafana-prometheus
     command:
       - --web.enable-remote-write-receiver
       - --config.file=/etc/prometheus/prometheus.yml
     ports:
      - 127.0.0.1:9090:9090/tcp
     volumes:
        - /srv/selfhosted/grafana/config/prom-config.yaml:/etc/prometheus/prometheus.yml


  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.0.2}
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    ports:
      - 127.0.0.1:3000:3000/tcp
    entrypoint:
       - sh
       - -euc
       - |
         mkdir -p /etc/grafana/provisioning/datasources
         cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
         apiVersion: 1
         datasources:
         - name: Loki
           type: loki
           access: proxy
           orgId: 1
           url: http://loki:3100
           basicAuth: false
           isDefault: false
           version: 1
           editable: false
         - name: Prometheus
           type: prometheus
           orgId: 1
           url: http://prometheus:9090
           basicAuth: false
           isDefault: true
           version: 1
           editable: false
         EOF
         /run.sh
    volumes:
        - /srv/selfhosted/grafana/data:/var/lib/grafana # sudo chown -R 472:472 /srv/selfhosted/grafana
    networks:
      - reverseproxy-nw
      - default

networks:
  reverseproxy-nw:
    external: true