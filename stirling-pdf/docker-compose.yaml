services:
  stirling-pdf:
    image: "frooodle/s-pdf"
    container_name: "stirling-pdf"
    networks:
      - reverseproxy-nw
    ports:
      - 127.0.0.1:8081:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  reverseproxy-nw:
    external: true