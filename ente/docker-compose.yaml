services:
  museum:
    image: ghcr.io/ente-io/server
    container_name: ente-museum
    ports:
      - 127.0.0.1:8080:8080 # API
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./credentials/museum.yaml:/museum.yaml:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - reverseproxy-nw
      - default

  # Resolve "localhost:3200" in the museum container to the minio container.
  # socat:
  #   image: alpine/socat
  #   container_name: ente-socat
  #   network_mode: service:museum
  #   depends_on: [museum]
  #   command: "TCP-LISTEN:3200,fork,reuseaddr TCP:minio:3200"

  web:
    image: ghcr.io/ente-io/web
    container_name: ente-web
    ports:
      - 127.0.0.1:3010:3000 # Photos web app
      - 127.0.0.1:3011:3001 # Accounts
      - 127.0.0.1:3012:3002 # Public albums
      - 127.0.0.1:3013:3003 # Auth
      # - 127.0.0.1:3014:3004 # Cast
      - 127.0.0.1:3015:3005 # Share
      - 127.0.0.1:3016:3006 # Embed
    # Modify these values to your custom subdomains, if using any
    environment:
      ENTE_API_ORIGIN: http://api.ente.thodkatz.ts.net
      ENTE_ALBUMS_ORIGIN: http://albums.ente.thodkatz.ts.net # when I set this to https://ente.thodkatz.ts.net/public-albums it displays 404
      ENTE_PHOTOS_ORIGIN: http://ente.thodkatz.ts.net
    networks:
      - reverseproxy-nw
      - default

  postgres:
    image: postgres:15
    container_name: ente-postgres
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ente_db
    healthcheck:
      test: pg_isready -q -d ente_db -U pguser
      start_period: 40s
      start_interval: 1s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: ente-minio
    ports:
      - 127.0.0.1:3200:3200 # api
      - 127.0.0.1:3201:3201 # web ui
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --address ":3200" --console-address ":3201"
    volumes:
      - minio-data:/data
    post_start:
      - command: |
          sh -c '
          #!/bin/sh

          while ! mc alias set h0 http://minio:3200 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
          do
            echo "Waiting for minio..."
            sleep 0.5
          done
 
          cd /data

          mc mb -p b2-eu-cen
          mc mb -p wasabi-eu-central-2-v3
          mc mb -p scw-eu-fr-v3
          '
    networks:
      - reverseproxy-nw
      - default


volumes:
  postgres-data:
  minio-data:

networks:
  reverseproxy-nw:
    external: true